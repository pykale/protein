model_id: InverseFolding/MapDiff
model_type: mapdiff
name: mapdiff
task: inverse_folding
objective: generative
runner: diffusion_generate
auto_map:
  AutoProteinConfig: configuration.MapDiffConfig
  AutoProteinModel: modeling.MapDiffModel
  AutoProteinGenerator: modeling.MapDiffGenerator
pretrained:
  local_dir: weights
  filename: mapdiff_weight.pt
  url: https://github.com/peizhenbai/MapDiff/releases/download/v1.0.1/mapdiff_weight.pt
streams:
  structure:
    modality: protein_structure
    input_key: backbone_coords
    processor: backbone_coordinate_processor
    encoder: mapdiff_structure_encoder
    processor_kwargs: {}
    encoder_kwargs:
      hidden_dim: 128
  noisy_sequence:
    modality: protein_sequence
    input_key: sequence
    processor: masked_sequence_tokenizer
    encoder: residue_token_embedding
    processor_kwargs:
      max_length: 512
      mask_token: <mask>
    encoder_kwargs:
      hidden_dim: 128
conditioner:
  type: structure_conditioned_denoising
  kwargs:
    hidden_dim: 128
head:
  type: diffusion_sequence_decoder
  kwargs:
    hidden_dim: 128
    vocab_size: 25
sampling:
  steps: 100
  num_samples: 8
  temperature: 1.0
evaluation:
  metrics:
    - sequence_recovery
    - diversity
    - novelty
interpretation:
  method: denoising_trajectory
