model_id: DTI/DrugBAN
model_type: drugban
name: drugban
task: drug_target_interaction
objective: discriminative
runner: predict
auto_map:
  AutoProteinConfig: configuration_drugban.DrugBANConfig
  AutoProteinModel: modeling_drugban.DrugBANModel
  AutoProteinPredictor: modeling_drugban.DrugBANInteractionPredictor
pretrained:
  local_dir: weights
  filename: drugban.pt
  url: ""
streams:
  drug:
    modality: small_molecule
    input_key: smiles
    processor: rdkit_graph
    encoder: drugban_molecule_gnn
    processor_kwargs: {}
    encoder_kwargs:
      hidden_dim: 128
      output_dim: 128
  target:
    modality: protein_sequence
    input_key: sequence
    processor: amino_acid_tokenizer
    encoder: drugban_protein_cnn
    processor_kwargs:
      max_length: 1000
    encoder_kwargs:
      hidden_dim: 128
      output_dim: 128
fusion:
  type: bilinear_attention
  kwargs:
    hidden_dim: 256
head:
  type: binary_classifier
  kwargs:
    input_dim: 256
    hidden_dim: 128
    output_dim: 1
loss:
  type: binary_cross_entropy
evaluation:
  metrics:
    - auroc
    - auprc
    - accuracy
    - f1
interpretation:
  method: bilinear_attention_map
