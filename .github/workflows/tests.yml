name: Tests

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    name: Python tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run unit tests
        run: python -m pytest -q

      - name: Byte-compile package
        run: python -m compileall -q kaleprotein

  package:
    name: Build and inspect distributions
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install packaging tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine

      - name: Build distributions
        run: python -m build

      - name: Check distribution metadata and contents
        run: |
          python -m twine check --strict dist/*
          python scripts/check_distribution.py dist

      - name: Install the core wheel in isolation
        run: |
          python -m venv "$RUNNER_TEMP/kaleprotein-core"
          "$RUNNER_TEMP/kaleprotein-core/bin/python" -m pip install --upgrade pip
          "$RUNNER_TEMP/kaleprotein-core/bin/python" -m pip install dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/kaleprotein-core/bin/python" - <<'PY'
          import importlib.util
          import kaleprotein

          assert kaleprotein.__version__
          assert importlib.util.find_spec("examples") is None
          assert importlib.util.find_spec("torch") is None
          PY
