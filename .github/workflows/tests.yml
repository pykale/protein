name: Tests

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    name: Python tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[drugban,mapdiff,dev]"

      - name: Run unit tests
        run: python -m pytest -q

      - name: Byte-compile package
        run: python -m compileall -q kaleprotein

      - name: Build distributions
        run: python -m build

      - name: Verify wheel package boundary
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile

          wheel = next(Path("dist").glob("*.whl"))
          with ZipFile(wheel) as archive:
              names = archive.namelist()

          assert any(name.startswith("kaleprotein/") for name in names)
          forbidden = (
              "kale_protein/",
              "examples/",
              "tests/",
              "kaleprotein/core/data/collators/",
              "kaleprotein/core/data/datasets/",
              "kaleprotein/core/data/modalities/",
              "kaleprotein/core/data/preprocessors/",
              "kaleprotein/core/data/tasks/",
          )
          assert not any(name.startswith(forbidden) for name in names), names
          PY
