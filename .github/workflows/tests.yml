name: Tests

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    name: Python tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test dependencies
        run: python -m pip install --upgrade pip

      - name: Run unit tests with unittest
        run: python -m unittest discover -s kale_protein/tests

      - name: Run unit tests with pytest
        run: |
          python -m pip install pytest
          pytest -q kale_protein/tests

      - name: Byte-compile package
        run: python -m compileall -q kale_protein

      - name: Run DrugBAN toy example
        run: python kale_protein/examples/drugban_dti/evaluate.py

      - name: Run MapDiff toy example
        run: python kale_protein/examples/mapdiff_inverse_folding/generate.py
