model_id: InverseFolding/MapDiff
model_type: mapdiff
name: mapdiff
task: inverse_folding
objective: generative
auto_map:
  AutoProteinConfig: configuration.MapDiffConfig
  AutoProteinPreprocessor: prepdata_mapdiff.MapDiffPreprocessor
  AutoProteinCollator: collators.MapDiffCollator
  AutoProteinModel: model_mapdiff.MapDiffModel
pretrained:
  local_dir: weights
  filename: mapdiff_weight.pt
  url: https://github.com/peizhenbai/MapDiff/releases/download/v1.0.1/mapdiff_weight.pt
  format: mapdiff-v1.0.1
  architecture: mapdiff-v1.0.1
model:
  architecture: mapdiff-v1.0.1
  input_feat_dim: 31
  edge_attr_dim: 93
  hidden_dim: 128
  egnn_depth: 6
  egnn_dropout: 0.1
  ipa_depth: 6
  ipa_heads: 4
  qk_points: 4
  v_points: 8
  ipa_dropout: 0.2
  timesteps: 500
  min_mask_ratio: 0.4
  mask_ratio_deviation: 0.2
  marginal_map: maps/train_marginal_x.json
preprocessing:
  cutoff: 30.0
  max_neighbors: 10
ipa_masking:
  candidate_rate: 0.6
  mask_rate: 0.8
  replace_rate: 0.1
  keep_rate: 0.1
training:
  ipa:
    epochs: 200
    batch_size: 8
    learning_rate: 0.0005
    weight_decay: 0.0
    beta1: 0.95
    beta2: 0.999
    scheduler: true
    validation_every: 1
  diffusion:
    epochs: 100
    batch_size: 8
    learning_rate: 0.0005
    weight_decay: 0.0
    beta1: 0.95
    beta2: 0.999
    scheduler: true
    validation_every: 20
  validation:
    steps: 50
    method: ddim
    num_samples: 1
streams:
  structure:
    modality: structure
    input_key: backbone_coords
    processor: backbone
    processor_kwargs: {}
components:
  embedders:
    structure:
      id: structure/mapdiff_condition
      kwargs: {}
  predictor:
    id: inverse_folding/mapdiff_generator
    kwargs: {}
sampling:
  steps: 100
  method: ddim
  num_samples: 1
  temperature: 1.0
evaluation:
  metrics:
    - sequence_recovery
    - perplexity
    - diversity
interpretation:
  method: denoising_trajectory
