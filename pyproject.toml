[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kaleprotein"
dynamic = ["version"]
description = "Registry-driven protein and small-molecule workflows"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = [
    "PyYAML>=6.0",
]

[project.optional-dependencies]
drugban = [
    "rdkit>=2022.9",
    "torch>=2.0",
]
mapdiff = [
    "torch>=2.0",
    "torch-geometric>=2.4",
]
dev = [
    "build>=1.2",
    "pytest>=7.0",
]

[tool.setuptools]
include-package-data = false
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]

[tool.setuptools.dynamic]
version = { file = ["kaleprotein/_version.txt"] }

[tool.setuptools.packages.find]
include = ["kaleprotein*"]
namespaces = true

[tool.setuptools.package-data]
kaleprotein = [
    "_version.txt",
    "**/*.json",
    "**/*.map",
    "**/*.yaml",
    "**/*.yml",
]
