[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kaleprotein"
dynamic = ["version"]
description = "Registry-driven protein and small-molecule workflows"
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
authors = [
    { name = "Wenrui Fan" },
]
keywords = [
    "bioinformatics",
    "drug-target interaction",
    "protein",
    "protein design",
    "pytorch",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "PyYAML>=6.0",
    "torch>=2.0",
]

[project.optional-dependencies]
drugban_dti = [
    "rdkit>=2022.9",
]
mapdiff_inverse_folding = [
    "torch-geometric>=2.4",
]
test = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "tomli>=2.0; python_version < '3.11'",
]
dev = [
    "build>=1.2",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.9",
    "tomli>=2.0; python_version < '3.11'",
    "twine>=6.0",
]

[project.urls]
Homepage = "https://github.com/pykale/protein"
Documentation = "https://github.com/pykale/protein/tree/main/docs"
Issues = "https://github.com/pykale/protein/issues"
Source = "https://github.com/pykale/protein"

[tool.setuptools]
include-package-data = false

[tool.setuptools.dynamic]
version = { file = ["kaleprotein/_version.txt"] }

[tool.setuptools.packages.find]
include = ["kaleprotein*"]
namespaces = true

[tool.setuptools.package-data]
kaleprotein = [
    "_version.txt",
    "**/*.json",
    "**/*.map",
    "**/*.yaml",
    "**/*.yml",
]
